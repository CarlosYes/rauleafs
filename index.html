<!DOCTYPE html>
<html lang="pt-PT">
<head>
<title>Radio Amigos Unidos</title>
<meta name="description" content="RAU" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
<link rel="icon" type="image/png" href="https://i.imgur.com/nNh98kV.png" sizes="48x48" />
<style>
    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        background-color: #2b1810;
        position: fixed;
        inset: 0;
        image-rendering: -webkit-optimize-contrast;
    }

    .xat-stage {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        overflow: hidden !important;
        background: url('https://xatimg.com/image/9QLM4IrOL4Ug.jpg') no-repeat center center;
        background-size: cover;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
    }

    .branch {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
    }

    .branch img {
        display: block;
        width: 100%;
        height: auto;
    }

    .b-left-top {
        width: 25vw;
        max-width: 310px;
        min-width: 130px;
        left: 0;
        top: -20px;
    }
    .b-left-top img {
        transform-origin: 0 50%;
        -webkit-animation: swayBranch 5s ease-in-out infinite alternate;
        animation: swayBranch 5s ease-in-out infinite alternate;
    }

    .b-left-mid {
        width: 12vw;
        max-width: 130px;
        min-width: 60px;
        left: 0;
        top: calc(32vh - 20px);
    }
    .b-left-mid img {
        transform-origin: 0 50%;
        -webkit-animation: swayBranch 5s ease-in-out 2.5s infinite alternate;
        animation: swayBranch 5s ease-in-out 2.5s infinite alternate;
    }

    .b-right-top {
        width: 38vw;
        max-width: 480px;
        min-width: 170px;
        top: 0;
        right: 0;
    }
    .b-right-top img {
        transform-origin: 100% 50%;
        -webkit-animation: swayBranch 5s ease-in-out 2.5s infinite alternate;
        animation: swayBranch 5s ease-in-out 2.5s infinite alternate;
    }

    .b-right-mid {
        width: 28vw;
        max-width: 370px;
        min-width: 140px;
        top: 0;
        right: 0;
    }
    .b-right-mid img {
        transform-origin: 100% 50%;
        -webkit-animation: swayBranch 5s ease-in-out 0s infinite alternate;
        animation: swayBranch 5s ease-in-out 0s infinite alternate;
    }

    .animal-left {
        position: absolute;
        bottom: 25px;
        left: 25px;
        z-index: 10;
        pointer-events: none;
        width: 18vw;
        max-width: 180px;
        min-width: 80px;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
    }

    .animal-right {
        position: absolute;
        bottom: 25px;
        right: 25px;
        z-index: 10;
        pointer-events: none;
        width: 22vw;
        max-width: 250px;
        min-width: 110px;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
    }

    .animal-left img, .animal-right img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
    }

    /* Queda de Folhas Densa, Lenta e com Vento (Wobble) */
    .leaves-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
        overflow: hidden;
    }

    .leaf {
        position: absolute;
        top: -12%;
        width: 24px;
        height: 24px;
        background-size: contain;
        background-repeat: no-repeat;
        opacity: 0.92;
        -webkit-animation: fallLeaf linear infinite, swayWind ease-in-out infinite alternate;
        animation: fallLeaf linear infinite, swayWind ease-in-out infinite alternate;
    }

    .type-1 { background-image: url('https://xatimg.com/image/3WSn23HKXYHL.png'); }
    .type-2 { background-image: url('https://xatimg.com/image/rtBHelEQAZx1.png'); }

    .sz-sm { width: 16px; height: 16px; opacity: 0.8; }
    .sz-md { width: 22px; height: 22px; opacity: 0.92; }
    .sz-lg { width: 28px; height: 28px; opacity: 0.98; }

    .l1  { left: 2%;  animation-duration: 22s, 4s; animation-delay: -2s, 0s; }
    .l2  { left: 5%;  animation-duration: 27s, 5.2s; animation-delay: -14s, -1.8s; }
    .l3  { left: 8%;  animation-duration: 20s, 3.8s; animation-delay: -8s, -1.2s; }
    .l4  { left: 12%; animation-duration: 26s, 5s; animation-delay: -11s, -1s; }
    .l5  { left: 15%; animation-duration: 23s, 4.3s; animation-delay: -19s, -2.5s; }
    .l6  { left: 18%; animation-duration: 20s, 3.5s; animation-delay: -5s, -2s; }
    .l7  { left: 22%; animation-duration: 28s, 5.5s; animation-delay: -16s, -0.7s; }
    .l8  { left: 25%; animation-duration: 24s, 4.5s; animation-delay: -15s, -1.5s; }
    .l9  { left: 29%; animation-duration: 21s, 4.1s; animation-delay: -3s, -2.8s; }
    .l10 { left: 32%; animation-duration: 25s, 4.9s; animation-delay: -12s, -1.1s; }
    .l11 { left: 35%; animation-duration: 21s, 4s; animation-delay: -3s, -0.5s; }
    .l12 { left: 39%; animation-duration: 19s, 3.7s; animation-delay: -17s, -2.2s; }
    .l13 { left: 42%; animation-duration: 28s, 5.5s; animation-delay: -18s, -3s; }
    .l14 { left: 46%; animation-duration: 23s, 4.4s; animation-delay: -6s, -0.9s; }
    .l15 { left: 49%; animation-duration: 19s, 3.8s; animation-delay: -8s, -1s; }
    .l16 { left: 53%; animation-duration: 26s, 5.1s; animation-delay: -13s, -2.4s; }
    .l17 { left: 56%; animation-duration: 25s, 4.2s; animation-delay: -12s, -2.5s; }
    .l18 { left: 60%; animation-duration: 22s, 3.9s; animation-delay: -4s, -1.6s; }
    .l19 { left: 63%; animation-duration: 22s, 4.8s; animation-delay: -4s, -1.2s; }
    .l20 { left: 67%; animation-duration: 27s, 5.3s; animation-delay: -21s, -0.4s; }
    .l21 { left: 70%; animation-duration: 27s, 5.2s; animation-delay: -16s, -2s; }
    .l22 { left: 74%; animation-duration: 20s, 4.2s; animation-delay: -2s, -1.9s; }
    .l23 { left: 77%; animation-duration: 20s, 3.9s; animation-delay: -9s, -0.8s; }
    .l24 { left: 81%; animation-duration: 24s, 4.7s; animation-delay: -15s, -2.7s; }
    .l25 { left: 84%; animation-duration: 24s, 4.6s; animation-delay: -6s, -1.8s; }
    .l26 { left: 88%; animation-duration: 21s, 4.0s; animation-delay: -10s, -0.6s; }
    .l27 { left: 91%; animation-duration: 23s, 4.1s; animation-delay: -14s, -2.2s; }
    .l28 { left: 94%; animation-duration: 26s, 5.4s; animation-delay: -18s, -1.3s; }
    .l29 { left: 97%; animation-duration: 21s, 4.7s; animation-delay: -7s, -0.3s; }
    .l30 { left: 99%; animation-duration: 25s, 5s; animation-delay: -10s, -1.7s; }

    @-webkit-keyframes swayBranch {
        0% { -webkit-transform: rotate(0deg) skewY(0deg); transform: rotate(0deg) skewY(0deg); }
        100% { -webkit-transform: rotate(3deg) skewY(4deg); transform: rotate(3deg) skewY(4deg); }
    }
    @keyframes swayBranch {
        0% { transform: rotate(0deg) skewY(0deg); }
        100% { transform: rotate(3deg) skewY(4deg); }
    }

    @-webkit-keyframes fallLeaf {
        0% { top: -12%; }
        100% { top: 108%; }
    }
    @keyframes fallLeaf {
        0% { top: -12%; }
        100% { top: 108%; }
    }

    @-webkit-keyframes swayWind {
        0% {
            -webkit-transform: translateX(-40px) rotate(0deg) rotateY(0deg);
            transform: translateX(-40px) rotate(0deg) rotateY(0deg);
        }
        50% {
            -webkit-transform: translateX(50px) rotate(180deg) rotateY(180deg);
            transform: translateX(50px) rotate(180deg) rotateY(180deg);
        }
        100% {
            -webkit-transform: translateX(-20px) rotate(360deg) rotateY(360deg);
            transform: translateX(-20px) rotate(360deg) rotateY(360deg);
        }
    }
    @keyframes swayWind {
        0% {
            transform: translateX(-40px) rotate(0deg) rotateY(0deg);
        }
        50% {
            transform: translateX(50px) rotate(180deg) rotateY(180deg);
        }
        100% {
            transform: translateX(-20px) rotate(360deg) rotateY(360deg);
        }
    }

    @media (max-width: 768px) {
        .animal-right { right: 15px; bottom: 15px; }
        .animal-left { left: 15px; bottom: 15px; }
    }
</style>
</head>
<body>

    <div class="xat-stage">

        <div class="branch b-left-top">
            <img src="https://xatimg.com/image/HIRVRQUXPQDX.png" alt="Ramo 1">
        </div>
        <div class="branch b-left-mid">
            <img src="https://xatimg.com/image/qlgzbCgmvbNw.png" alt="Ramo 2">
        </div>
        <div class="branch b-right-top">
            <img src="https://xatimg.com/image/senTBrK41iGo.png" alt="Ramo 3">
        </div>
        <div class="branch b-right-mid">
            <img src="https://xatimg.com/image/p0WiGcIaZGpJ.png" alt="Ramo 4">
        </div>

        <div class="animal-left">
            <img src="https://xatimg.com/image/mzEyQtqFoRl4.png" alt="Pássaro">
        </div>

        <div class="animal-right">
            <img src="https://xatimg.com/image/Mpp11jhfeeiR.png" alt="Esquilo">
        </div>

        <div class="leaves-layer">
            <div class="leaf type-1 sz-md l1"></div>
            <div class="leaf type-2 sz-sm l2"></div>
            <div class="leaf type-1 sz-lg l3"></div>
            <div class="leaf type-2 sz-md l4"></div>
            <div class="leaf type-1 sz-sm l5"></div>
            <div class="leaf type-2 sz-lg l6"></div>
            <div class="leaf type-1 sz-md l7"></div>
            <div class="leaf type-2 sz-sm l8"></div>
            <div class="leaf type-1 sz-lg l9"></div>
            <div class="leaf type-2 sz-md l10"></div>
            <div class="leaf type-1 sz-sm l11"></div>
            <div class="leaf type-2 sz-lg l12"></div>
            <div class="leaf type-1 sz-md l13"></div>
            <div class="leaf type-2 sz-sm l14"></div>
            <div class="leaf type-1 sz-lg l15"></div>
            <div class="leaf type-2 sz-md l16"></div>
            <div class="leaf type-1 sz-sm l17"></div>
            <div class="leaf type-2 sz-lg l18"></div>
            <div class="leaf type-1 sz-md l19"></div>
            <div class="leaf type-2 sz-sm l20"></div>
            <div class="leaf type-1 sz-lg l21"></div>
            <div class="leaf type-2 sz-md l22"></div>
            <div class="leaf type-1 sz-sm l23"></div>
            <div class="leaf type-2 sz-lg l24"></div>
            <div class="leaf type-1 sz-md l25"></div>
            <div class="leaf type-2 sz-sm l26"></div>
            <div class="leaf type-1 sz-lg l27"></div>
            <div class="leaf type-2 sz-md l28"></div>
            <div class="leaf type-1 sz-sm l29"></div>
            <div class="leaf type-2 sz-lg l30"></div>
        </div>

    </div>

</body>
</html>
