<!DOCTYPE html>
<html lang="pt-PT">
<head>
<title>Radio Amigos Unidos</title>
<meta name="description" content="RAU" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
<link rel="icon" type="image/png" href="https://i.imgur.com/nNh98kV.png" sizes="48x48" />
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Garante nitidez máxima e evita qualquer efeito de desfoque no xat.com */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #2b1810;
            position: fixed;
            inset: 0;
            image-rendering: -webkit-optimize-contrast;
        }

        .js-ag-autumn-block {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            overflow: hidden !important;
        }

        .js-ag-leaves-block {
            width: 100%;
            height: 100%;
            background: url('https://xatimg.com/image/9QLM4IrOL4Ug.jpg') no-repeat center center;
            background-size: cover;
            position: absolute;
            inset: 0;
            overflow: hidden !important;
            transform: translateZ(0); /* Força aceleração por hardware para evitar desfoque */
        }

        /* Sistema de Folhas a Cair em CSS Puro (100% Fluido em todos os navegadores e no xat.com) */
        .css-falling-leaves {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .css-leaf {
            position: absolute;
            top: -10%;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.95;
            will-change: transform, top;
            animation: cssFall linear infinite;
        }

        @keyframes cssFall {
            0% {
                top: -10%;
                transform: translateX(0px) rotate(0deg) rotateY(0deg);
            }
            50% {
                transform: translateX(35px) rotate(180deg) rotateY(180deg);
            }
            100% {
                top: 105%;
                transform: translateX(-25px) rotate(360deg) rotateY(360deg);
            }
        }

        /* Ramos / Pernadas */
        .js-ag-branch {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            transform: translateZ(0);
        }

        .js-ag-branch img {
            display: block;
            width: 100%;
            height: auto;
            opacity: 1;
        }

        /* Ramos da Esquerda (Subidos 20px) */
        .js-ag-branch-3 {
            width: 25vw;
            max-width: 310px;
            min-width: 140px;
            left: 0;
            top: -20px;
        }
        .js-ag-branch-3 img {
            transform-origin: 0 50%;
            animation: an-branch-1 5s ease-in-out infinite alternate;
        }

        .js-ag-branch-4 {
            width: 12vw;
            max-width: 130px;
            min-width: 65px;
            left: 0;
            top: calc(32vh - 20px);
        }
        .js-ag-branch-4 img {
            transform-origin: 0 50%;
            animation: an-branch-2 5s ease-in-out 3s infinite alternate;
        }

        /* Ramos da Direita */
        .js-ag-branch-5 {
            width: 38vw;
            max-width: 480px;
            min-width: 180px;
            top: 0;
            right: 0;
        }
        .js-ag-branch-5 img {
            transform-origin: 100% 50%;
            animation: an-branch-1 5s ease-in-out 3s infinite alternate;
        }

        .js-ag-branch-6 {
            width: 28vw;
            max-width: 370px;
            min-width: 150px;
            top: 0;
            right: 0;
        }
        .js-ag-branch-6 img {
            transform-origin: 100% 50%;
            animation: an-branch-2 5s ease-in-out 0s infinite alternate;
        }

        /* Esquilo (Canto Direito Adaptável e Nítido) */
        .custom-item-right {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            pointer-events: none;
            width: 22vw;
            max-width: 250px;
            min-width: 120px;
            transform: translateZ(0);
            animation: fadeInItem 1s ease-out forwards;
        }

        .custom-item-right img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
        }

        /* Pássaro (Canto Esquerdo Adaptável e Nítido) */
        .custom-item-left {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
            width: 18vw;
            max-width: 180px;
            min-width: 90px;
            transform: translateZ(0);
            animation: fadeInItem 1s ease-out 0.2s forwards;
            opacity: 0;
        }

        .custom-item-left img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
        }

        @keyframes fadeInItem {
            from {
                opacity: 0;
                transform: translateY(30px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        @keyframes an-branch-1 {
            0% { transform: rotate(0deg) skewY(0deg); }
            100% { transform: rotate(3deg) skewY(5deg); }
        }

        @keyframes an-branch-2 {
            0% { transform: rotate(0deg) skewX(0deg); }
            100% { transform: rotate(-3deg) skewX(5deg); }
        }

        @media (max-width: 768px) {
            .custom-item-right {
                right: 15px;
                bottom: 15px;
            }
            .custom-item-left {
                left: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="js-ag-autumn-block">
        <div class="js-ag-leaves-block">

            <div class="js-ag-branch js-ag-branch-3">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-left.png" alt="Ramo 3">
            </div>
            <div class="js-ag-branch js-ag-branch-4">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-left-2.png" alt="Ramo 4">
            </div>
            <div class="js-ag-branch js-ag-branch-5">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-right-2.png" alt="Ramo 5">
            </div>
            <div class="js-ag-branch js-ag-branch-6">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-right.png" alt="Ramo 6">
            </div>

            <div class="custom-item-left">
                <img src="https://xatimg.com/image/mzEyQtqFoRl4.png" alt="Pássaro">
            </div>

            <div class="custom-item-right">
                <img src="https://xatimg.com/image/Mpp11jhfeeiR.png" alt="Esquilo">
            </div>

            <div id="css-leaves-container" class="css-falling-leaves"></div>

        </div>
    </div>

    <script>
        const leafImages = [
            "https://www.pngall.com/wp-content/uploads/2016/07/Canada-Leaf-PNG-Image.png",
            "https://www.pngkey.com/png/full/92-92803_fall-png-autumn-leaf-transparent-background.png"
        ];

        // Gerador de folhas ultra-lentes totalmente otimizado para o xat.com
        function createCSSLeaves() {
            const container = document.getElementById('css-leaves-container');
            if (!container) return;
            container.innerHTML = '';

            const count = 35;
            for (let i = 0; i < count; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'css-leaf';
                
                const imgSrc = leafImages[Math.floor(Math.random() * leafImages.length)];
                leaf.style.backgroundImage = `url('${imgSrc}')`;
                
                leaf.style.left = `${Math.random() * 100}%`;
                const size = Math.floor(Math.random() * 14) + 14;
                leaf.style.width = `${size}px`;
                leaf.style.height = `${size}px`;
                
                // Queda ultra-lenta (entre 12s e 24s)
                const duration = (Math.random() * 12 + 12).toFixed(2);
                const delay = (Math.random() * 12).toFixed(2);
                leaf.style.animationDuration = `${duration}s`;
                leaf.style.animationDelay = `-${delay}s`;
                
                container.appendChild(leaf);
            }
        }

        window.addEventListener("DOMContentLoaded", createCSSLeaves);
    </script>
</body>
</html>
