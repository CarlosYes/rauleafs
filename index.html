<!DOCTYPE html>
<html lang="pt-PT">
<head>
<title>Radio Amigos Unidos</title>
<meta name="description" content="RAU" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
<link rel="icon" type="image/png" href="https://i.imgur.com/nNh98kV.png" sizes="48x48" />
<style>
    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* Estrutura fixa para o iframe do xat.com sem barras de scroll */
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        background-color: #2b1810;
        position: fixed;
        inset: 0;
        image-rendering: -webkit-optimize-contrast;
    }

    .autumn-container {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        overflow: hidden !important;
    }

    /* Imagem de Fundo Completa */
    .autumn-background {
        width: 100%;
        height: 100%;
        background: url('https://xatimg.com/image/9QLM4IrOL4Ug.jpg') no-repeat center center;
        background-size: cover;
        position: absolute;
        inset: 0;
        overflow: hidden !important;
        transform: translateZ(0);
    }

    /* ==========================================
       RAMOS DE ÁRVORE (Balanço Contínuo em CSS)
       ========================================== */
    .branch {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        transform: translateZ(0);
    }

    .branch img {
        display: block;
        width: 100%;
        height: auto;
    }

    /* Ramos da Esquerda (Subidos 20px) */
    .branch-left-top {
        width: 25vw;
        max-width: 310px;
        min-width: 140px;
        left: 0;
        top: -20px;
    }
    .branch-left-top img {
        transform-origin: 0 50%;
        animation: swayLeft 5s ease-in-out infinite alternate;
    }

    .branch-left-middle {
        width: 12vw;
        max-width: 130px;
        min-width: 65px;
        left: 0;
        top: calc(32vh - 20px);
    }
    .branch-left-middle img {
        transform-origin: 0 50%;
        animation: swayRight 5s ease-in-out 2.5s infinite alternate;
    }

    /* Ramos da Direita */
    .branch-right-top {
        width: 38vw;
        max-width: 480px;
        min-width: 180px;
        top: 0;
        right: 0;
    }
    .branch-right-top img {
        transform-origin: 100% 50%;
        animation: swayLeft 5s ease-in-out 2.5s infinite alternate;
    }

    .branch-right-middle {
        width: 28vw;
        max-width: 370px;
        min-width: 150px;
        top: 0;
        right: 0;
    }
    .branch-right-middle img {
        transform-origin: 100% 50%;
        animation: swayRight 5s ease-in-out 0s infinite alternate;
    }

    /* ==========================================
       ANIMAIS (Esquilo e Pássaro Responsivos)
       ========================================== */
    .animal-left {
        position: absolute;
        bottom: 30px;
        left: 30px;
        z-index: 10;
        pointer-events: none;
        width: 18vw;
        max-width: 180px;
        min-width: 90px;
        transform: translateZ(0);
    }

    .animal-left img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
    }

    .animal-right {
        position: absolute;
        bottom: 30px;
        right: 30px;
        z-index: 10;
        pointer-events: none;
        width: 22vw;
        max-width: 250px;
        min-width: 120px;
        transform: translateZ(0);
    }

    .animal-right img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
    }

    /* ==========================================
       QUEDA DE FOLHAS (CSS Puro & Ultra-Lento)
       ========================================== */
    .leaves-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
        overflow: hidden;
    }

    .leaf {
        position: absolute;
        top: -12%;
        width: 24px;
        height: 24px;
        background-size: contain;
        background-repeat: no-repeat;
        opacity: 0.95;
        will-change: transform, top;
        animation: fallAndRotate linear infinite;
    }

    /* Variações individuais das folhas */
    .leaf-type-1 { background-image: url('https://www.pngall.com/wp-content/uploads/2016/07/Canada-Leaf-PNG-Image.png'); }
    .leaf-type-2 { background-image: url('https://www.pngkey.com/png/full/92-92803_fall-png-autumn-leaf-transparent-background.png'); }

    .l1  { left: 3%;  width: 22px; height: 22px; animation-duration: 16s; animation-delay: -1s; }
    .l2  { left: 10%; width: 18px; height: 18px; animation-duration: 22s; animation-delay: -7s; }
    .l3  { left: 18%; width: 26px; height: 26px; animation-duration: 14s; animation-delay: -12s; }
    .l4  { left: 26%; width: 20px; height: 20px; animation-duration: 19s; animation-delay: -3s; }
    .l5  { left: 34%; width: 24px; height: 24px; animation-duration: 17s; animation-delay: -15s; }
    .l6  { left: 42%; width: 16px; height: 16px; animation-duration: 24s; animation-delay: -5s; }
    .l7  { left: 50%; width: 25px; height: 25px; animation-duration: 15s; animation-delay: -9s; }
    .l8  { left: 58%; width: 21px; height: 21px; animation-duration: 20s; animation-delay: -2s; }
    .l9  { left: 66%; width: 23px; height: 23px; animation-duration: 18s; animation-delay: -14s; }
    .l10 { left: 74%; width: 19px; height: 19px; animation-duration: 21s; animation-delay: -8s; }
    .l11 { left: 82%; width: 27px; height: 27px; animation-duration: 13s; animation-delay: -11s; }
    .l12 { left: 90%; width: 20px; height: 20px; animation-duration: 23s; animation-delay: -4s; }
    .l13 { left: 96%; width: 22px; height: 22px; animation-duration: 16s; animation-delay: -10s; }

    /* ==========================================
       KEYFRAMES DE ANIMAÇÃO NATIVA
       ========================================== */
    @keyframes fallAndRotate {
        0% {
            top: -12%;
            transform: translateX(0px) rotate(0deg) rotateY(0deg);
        }
        50% {
            transform: translateX(40px) rotate(180deg) rotateY(180deg);
        }
        100% {
            top: 108%;
            transform: translateX(-30px) rotate(360deg) rotateY(360deg);
        }
    }

    @keyframes swayLeft {
        0% { transform: rotate(0deg) skewY(0deg); }
        100% { transform: rotate(3.5deg) skewY(5deg); }
    }

    @keyframes swayRight {
        0% { transform: rotate(0deg) skewX(0deg); }
        100% { transform: rotate(-3.5deg) skewX(5deg); }
    }

    @media (max-width: 768px) {
        .animal-right { right: 15px; bottom: 15px; }
        .animal-left { left: 15px; bottom: 15px; }
    }
</style>
</head>
<body>

    <div class="autumn-container">
        <div class="autumn-background">

            <!-- Ramos de Árvore (Animação CSS Pura) -->
            <div class="branch branch-left-top">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-left.png" alt="Ramo 1">
            </div>
            <div class="branch branch-left-middle">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-left-2.png" alt="Ramo 2">
            </div>
            <div class="branch branch-right-top">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-right-2.png" alt="Ramo 3">
            </div>
            <div class="branch branch-right-middle">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-right.png" alt="Ramo 4">
            </div>

            <!-- Pássaro (Canto Esquerdo) -->
            <div class="animal-left">
                <img src="https://xatimg.com/image/mzEyQtqFoRl4.png" alt="Pássaro">
            </div>

            <!-- Esquilo (Canto Direito) -->
            <div class="animal-right">
                <img src="https://xatimg.com/image/Mpp11jhfeeiR.png" alt="Esquilo">
            </div>

            <!-- Folhas a Cair Ultra-Lentas (Sem JavaScript) -->
            <div class="leaves-container">
                <div class="leaf leaf-type-1 l1"></div>
                <div class="leaf leaf-type-2 l2"></div>
                <div class="leaf leaf-type-1 l3"></div>
                <div class="leaf leaf-type-2 l4"></div>
                <div class="leaf leaf-type-1 l5"></div>
                <div class="leaf leaf-type-2 l6"></div>
                <div class="leaf leaf-type-1 l7"></div>
                <div class="leaf leaf-type-2 l8"></div>
                <div class="leaf leaf-type-1 l9"></div>
                <div class="leaf leaf-type-2 l10"></div>
                <div class="leaf leaf-type-1 l11"></div>
                <div class="leaf leaf-type-2 l12"></div>
                <div class="leaf leaf-type-1 l13"></div>
            </div>

        </div>
    </div>

</body>
</html>
