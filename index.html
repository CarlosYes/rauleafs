<!DOCTYPE html>
<html lang="pt-PT">
<head>
<title>Radio Amigos Unidos</title>
<meta name="description" content="RAU" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
<link rel="icon" type="image/png" href="https://i.imgur.com/nNh98kV.png" sizes="48x48" />
<style>
    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* Impede barras de scroll e garante nitidez no iframe do xat.com */
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        background-color: #2b1810;
        position: fixed;
        inset: 0;
        image-rendering: -webkit-optimize-contrast;
    }

    .xat-stage {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        overflow: hidden !important;
        background: url('https://xatimg.com/image/9QLM4IrOL4Ug.jpg') no-repeat center center;
        background-size: cover;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
    }

    .branch {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
    }

    .branch img {
        display: block;
        width: 100%;
        height: auto;
    }

    .b-left-top {
        width: 25vw;
        max-width: 310px;
        min-width: 130px;
        left: 0;
        top: -20px;
    }
    .b-left-top img {
        transform-origin: 0 50%;
        -webkit-animation: swayBranch 5s ease-in-out infinite alternate;
        animation: swayBranch 5s ease-in-out infinite alternate;
    }

    .b-left-mid {
        width: 12vw;
        max-width: 130px;
        min-width: 60px;
        left: 0;
        top: calc(32vh - 20px);
    }
    .b-left-mid img {
        transform-origin: 0 50%;
        -webkit-animation: swayBranch 5s ease-in-out 2.5s infinite alternate;
        animation: swayBranch 5s ease-in-out 2.5s infinite alternate;
    }

    .b-right-top {
        width: 38vw;
        max-width: 480px;
        min-width: 170px;
        top: 0;
        right: 0;
    }
    .b-right-top img {
        transform-origin: 100% 50%;
        -webkit-animation: swayBranch 5s ease-in-out 2.5s infinite alternate;
        animation: swayBranch 5s ease-in-out 2.5s infinite alternate;
    }

    .b-right-mid {
        width: 28vw;
        max-width: 370px;
        min-width: 140px;
        top: 0;
        right: 0;
    }
    .b-right-mid img {
        transform-origin: 100% 50%;
        -webkit-animation: swayBranch 5s ease-in-out 0s infinite alternate;
        animation: swayBranch 5s ease-in-out 0s infinite alternate;
    }

    .animal-left {
        position: absolute;
        bottom: 25px;
        left: 25px;
        z-index: 10;
        pointer-events: none;
        width: 18vw;
        max-width: 180px;
        min-width: 80px;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
    }

    .animal-right {
        position: absolute;
        bottom: 25px;
        right: 25px;
        z-index: 10;
        pointer-events: none;
        width: 22vw;
        max-width: 250px;
        min-width: 110px;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
    }

    .animal-left img, .animal-right img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
    }

    .leaves-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
        overflow: hidden;
    }

    .leaf {
        position: absolute;
        top: -12%;
        width: 24px;
        height: 24px;
        background-size: contain;
        background-repeat: no-repeat;
        opacity: 0.92;
        -webkit-animation: fallLeaf linear infinite, swayWind ease-in-out infinite alternate;
        animation: fallLeaf linear infinite, swayWind ease-in-out infinite alternate;
    }

    .type-1 { background-image: url('https://xatimg.com/image/3WSn23HKXYHL.png'); }
    .type-2 { background-image: url('https://xatimg.com/image/rtBHelEQAZx1.png'); }

    .l1  { left: 3%;  animation-duration: 22s, 4s; animation-delay: -2s, 0s; }
    .l2  { left: 10%; animation-duration: 26s, 5s; animation-delay: -11s, -1s; }
    .l3  { left: 17%; animation-duration: 20s, 3.5s; animation-delay: -5s, -2s; }
    .l4  { left: 24%; animation-duration: 24s, 4.5s; animation-delay: -15s, -1.5s; }
    .l5  { left: 31%; animation-duration: 21s, 4s; animation-delay: -3s, -0.5s; }
    .l6  { left: 38%; animation-duration: 28s, 5.5s; animation-delay: -18s, -3s; }
    .l7  { left: 45%; animation-duration: 19s, 3.8s; animation-delay: -8s, -1s; }
    .l8  { left: 52%; animation-duration: 25s, 4.2s; animation-delay: -12s, -2.5s; }
    .l9  { left: 59%; animation-duration: 22s, 4.8s; animation-delay: -4s, -1.2s; }
    .l10 { left: 66%; animation-duration: 27s, 5.2s; animation-delay: -16s, -2s; }
    .l11 { left: 73%; animation-duration: 20s, 3.9s; animation-delay: -9s, -0.8s; }
    .l12 { left: 80%; animation-duration: 24s, 4.6s; animation-delay: -6s, -1.8s; }
    .l13 { left: 87%; animation-duration: 23s, 4.1s; animation-delay: -14s, -2.2s; }
    .l14 { left: 93%; animation-duration: 21s, 4.7s; animation-delay: -7s, -0.3s; }
    .l15 { left: 97%; animation-duration: 25s, 5s; animation-delay: -10s, -1.7s; }

    /* Keyframes de Movimento dos Ramos */
    @-webkit-keyframes swayBranch {
        0% { -webkit-transform: rotate(0deg) skewY(0deg); transform: rotate(0deg) skewY(0deg); }
        100% { -webkit-transform: rotate(3deg) skewY(4deg); transform: rotate(3deg) skewY(4deg); }
    }
    @keyframes swayBranch {
        0% { transform: rotate(0deg) skewY(0deg); }
        100% { transform: rotate(3deg) skewY(4deg); }
    }

    @-webkit-keyframes fallLeaf {
        0% { top: -12%; }
        100% { top: 108%; }
    }
    @keyframes fallLeaf {
        0% { top: -12%; }
        100% { top: 108%; }
    }

    @-webkit-keyframes swayWind {
        0% {
            -webkit-transform: translateX(-40px) rotate(0deg) rotateY(0deg);
            transform: translateX(-40px) rotate(0deg) rotateY(0deg);
        }
        50% {
            -webkit-transform: translateX(50px) rotate(180deg) rotateY(180deg);
            transform: translateX(50px) rotate(180deg) rotateY(180deg);
        }
        100% {
            -webkit-transform: translateX(-20px) rotate(360deg) rotateY(360deg);
            transform: translateX(-20px) rotate(360deg) rotateY(360deg);
        }
    }
    @keyframes swayWind {
        0% {
            transform: translateX(-40px) rotate(0deg) rotateY(0deg);
        }
        50% {
            transform: translateX(50px) rotate(180deg) rotateY(180deg);
        }
        100% {
            transform: translateX(-20px) rotate(360deg) rotateY(360deg);
        }
    }

    @media (max-width: 768px) {
        .animal-right { right: 15px; bottom: 15px; }
        .animal-left { left: 15px; bottom: 15px; }
    }
</style>
</head>
<body>

    <div class="xat-stage">

        <div class="branch b-left-top">
            <img src="https://xatimg.com/image/HIRVRQUXPQDX.png" alt="Ramo 1">
        </div>
        <div class="branch b-left-mid">
            <img src="https://xatimg.com/image/qlgzbCgmvbNw.png" alt="Ramo 2">
        </div>
        <div class="branch b-right-top">
            <img src="https://xatimg.com/image/senTBrK41iGo.png" alt="Ramo 3">
        </div>
        <div class="branch b-right-mid">
            <img src="https://xatimg.com/image/p0WiGcIaZGpJ.png" alt="Ramo 4">
        </div>

        <div class="animal-left">
            <img src="https://xatimg.com/image/mzEyQtqFoRl4.png" alt="Pássaro">
        </div>

        <div class="animal-right">
            <img src="https://xatimg.com/image/Mpp11jhfeeiR.png" alt="Esquilo">
        </div>

        <div class="leaves-layer">
            <div class="leaf type-1 l1"></div>
            <div class="leaf type-2 l2"></div>
            <div class="leaf type-1 l3"></div>
            <div class="leaf type-2 l4"></div>
            <div class="leaf type-1 l5"></div>
            <div class="leaf type-2 l6"></div>
            <div class="leaf type-1 l7"></div>
            <div class="leaf type-2 l8"></div>
            <div class="leaf type-1 l9"></div>
            <div class="leaf type-2 l10"></div>
            <div class="leaf type-1 l11"></div>
            <div class="leaf type-2 l12"></div>
            <div class="leaf type-1 l13"></div>
            <div class="leaf type-2 l14"></div>
            <div class="leaf type-1 l15"></div>
        </div>

    </div>

</body>
</html>
