<!DOCTYPE html>
<html lang="pt-PT">
<head>
<title>Radio Amigos Unidos</title>
<meta name="description" content="RAU" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
<link rel="icon" type="image/png" href="https://i.imgur.com/nNh98kV.png" sizes="48x48" />
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #2b1810;
            position: fixed;
            inset: 0;
        }

        .js-ag-autumn-block {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            overflow: hidden !important;
        }

        .js-ag-leaves-block {
            width: 100%;
            height: 100%;
            background: url('https://xatimg.com/image/9QLM4IrOL4Ug.jpg') no-repeat center center;
            background-size: cover;
            position: absolute;
            inset: 0;
            overflow: hidden !important;
        }

        /* Camada de Partículas tsParticles / Canvas */
        #tsparticles {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Camada CSS Fallback de Folhas para o xat.com */
        .css-falling-leaves {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .css-leaf {
            position: absolute;
            top: -50px;
            width: 24px;
            height: 24px;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;
            will-change: transform;
            animation: cssFall linear infinite;
        }

        @keyframes cssFall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg) rotateY(0deg);
            }
            50% {
                transform: translateX(30px) rotate(180deg) rotateY(180deg);
            }
            100% {
                top: 105%;
                transform: translateX(-20px) rotate(360deg) rotateY(360deg);
            }
        }

        /* Ramos / Pernadas */
        .js-ag-branch {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            will-change: transform;
        }

        .js-ag-branch img {
            display: block;
            width: 100%;
            height: auto;
            opacity: 1;
        }

        /* Ramos da Esquerda (Subidos 20px) */
        .js-ag-branch-3 {
            width: 25vw;
            max-width: 310px;
            min-width: 140px;
            left: 0;
            top: -20px;
        }
        .js-ag-branch-3 img {
            transform-origin: 0 50%;
            animation: an-branch-1 5s ease-in-out infinite alternate;
        }

        .js-ag-branch-4 {
            width: 12vw;
            max-width: 130px;
            min-width: 65px;
            left: 0;
            top: calc(32vh - 20px);
        }
        .js-ag-branch-4 img {
            transform-origin: 0 50%;
            animation: an-branch-2 5s ease-in-out 3s infinite alternate;
        }

        /* Ramos da Direita */
        .js-ag-branch-5 {
            width: 38vw;
            max-width: 480px;
            min-width: 180px;
            top: 0;
            right: 0;
        }
        .js-ag-branch-5 img {
            transform-origin: 100% 50%;
            animation: an-branch-1 5s ease-in-out 3s infinite alternate;
        }

        .js-ag-branch-6 {
            width: 28vw;
            max-width: 370px;
            min-width: 150px;
            top: 0;
            right: 0;
        }
        .js-ag-branch-6 img {
            transform-origin: 100% 50%;
            animation: an-branch-2 5s ease-in-out 0s infinite alternate;
        }

        /* Esquilo (Canto Direito Adaptável) */
        .custom-item-right {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            pointer-events: none;
            width: 22vw;
            max-width: 250px;
            min-width: 120px;
        }

        .custom-item-right img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
        }

        /* Pássaro (Canto Esquerdo Adaptável) */
        .custom-item-left {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
            width: 18vw;
            max-width: 180px;
            min-width: 90px;
        }

        .custom-item-left img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
        }

        @keyframes an-branch-1 {
            0% { transform: rotate(0deg) skewY(0deg); }
            100% { transform: rotate(3deg) skewY(5deg); }
        }

        @keyframes an-branch-2 {
            0% { transform: rotate(0deg) skewX(0deg); }
            100% { transform: rotate(-3deg) skewX(5deg); }
        }

        @media (max-width: 768px) {
            .custom-item-right {
                right: 15px;
                bottom: 15px;
            }
            .custom-item-left {
                left: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="js-ag-autumn-block">
        <div class="js-ag-leaves-block">

            <div class="js-ag-branch js-ag-branch-3">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-left.png" alt="Ramo 3">
            </div>
            <div class="js-ag-branch js-ag-branch-4">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-left-2.png" alt="Ramo 4">
            </div>
            <div class="js-ag-branch js-ag-branch-5">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-right-2.png" alt="Ramo 5">
            </div>
            <div class="js-ag-branch js-ag-branch-6">
                <img src="https://raw.githubusercontent.com/SochavaAG/example-mycode/master/pens/greensock-leaves/images/branch-right.png" alt="Ramo 6">
            </div>

            <div class="custom-item-left">
                <img src="https://xatimg.com/image/mzEyQtqFoRl4.png" alt="Pássaro">
            </div>

            <div class="custom-item-right">
                <img src="https://xatimg.com/image/Mpp11jhfeeiR.png" alt="Esquilo">
            </div>

            <div id="tsparticles"></div>
            <div id="css-leaves-container" class="css-falling-leaves"></div>

        </div>
    </div>

    <!-- Bibliotecas de Suporte -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <script>
        const leafImages = [
            "https://www.pngall.com/wp-content/uploads/2016/07/Canada-Leaf-PNG-Image.png",
            "https://www.pngkey.com/png/full/92-92803_fall-png-autumn-leaf-transparent-background.png"
        ];

        // Gerador de Folhas CSS para o xat.com (Infalível em qualquer navegador)
        function createCSSLeaves() {
            const container = document.getElementById('css-leaves-container');
            if (!container) return;
            container.innerHTML = '';

            const count = 35;
            for (let i = 0; i < count; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'css-leaf';
                
                const imgSrc = leafImages[Math.floor(Math.random() * leafImages.length)];
                leaf.style.backgroundImage = `url('${imgSrc}')`;
                
                leaf.style.left = `${Math.random() * 100}%`;
                const size = Math.floor(Math.random() * 14) + 14;
                leaf.style.width = `${size}px`;
                leaf.style.height = `${size}px`;
                
                // Queda ultra-lenta (entre 12s e 25s)
                const duration = (Math.random() * 13 + 12).toFixed(2);
                const delay = (Math.random() * 10).toFixed(2);
                leaf.style.animationDuration = `${duration}s`;
                leaf.style.animationDelay = `-${delay}s`;
                
                container.appendChild(leaf);
            }
        }

        // Tenta inicializar o tsParticles; se falhar/bloquear, ativa o fallback CSS
        function initScene() {
            $('.js-ag-autumn-block').addClass('js-ag-anim');
            
            if (typeof gsap !== "undefined") {
                gsap.from('.custom-item-right', { y: 30, alpha: 0, duration: 1.0, delay: 0.2 });
                gsap.from('.custom-item-left', { y: 30, alpha: 0, duration: 1.0, delay: 0.3 });
            }

            createCSSLeaves();

            if (typeof tsParticles !== "undefined") {
                try {
                    tsParticles.load({
                        id: "tsparticles",
                        options: {
                            particles: {
                                move: {
                                    direction: "bottom",
                                    enable: true,
                                    outModes: { default: "out" },
                                    size: true,
                                    speed: { min: 0.03, max: 0.15 }
                                },
                                number: { value: 35, density: { enable: true, area: 800 } },
                                opacity: { value: 0.95 },
                                rotate: { value: { min: 0, max: 360 }, direction: "random", move: true, animation: { enable: true, speed: 12 } },
                                tilt: { direction: "random", enable: true, move: true, value: { min: 0, max: 360 }, animation: { enable: true, speed: 10, sync: false } },
                                shape: {
                                    type: "image",
                                    options: {
                                        image: [
                                            { src: leafImages[0], width: 240, height: 240 },
                                            { src: leafImages[1], width: 240, height: 240 }
                                        ]
                                    }
                                },
                                size: { value: { min: 14, max: 26 } },
                                roll: { enable: true, speed: { min: 4, max: 8 } },
                                wobble: { distance: 30, enable: true, move: true, speed: { min: -5, max: 5 } }
                            }
                        }
                    });
                } catch(e) {
                    // Se o xat.com bloquear o canvas das partículas, as folhas CSS acima cobrem o efeito sem falha.
                }
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initScene);
        } else {
            initScene();
        }
    </script>
</body>
</html>
